
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/includes.js" defer></script>
    <style>
</style>

<body>

<!-- PAGE TOP: filled in from header.html -->
<div id="page-top"></div>

<main class="page-main">
  <div class="hero">
    <img class="hero-image" src="images/hero-home.jpg" alt="">
  <h1 class="hero-title">Contact Me</h1>
  

  <form action="https://formspree.io/f/xbgogael" method="POST" id="contact-form">
<p><label for="first-name">First Name</label><input type="text" id="first-name" name="first-name"></p>
<p><label for="last-name">Last Name</label><input type="text" id="last-name" name="last-name"></p>
<p><label for="email">Email</label><input type="email" id="email" name="email" required></p>
<p><label for="phone">Phone</label><input type="tel" id="phone" name="phone" class="phone"></p>
<p><label for="message">Message</label><textarea id="message" name="message" rows="6" cols="40"></textarea></p>
<p><button type="submit">Send Message</button></p>
<p><strong>Preferred method of contact:</strong></p>

<div class="contact-options">

  <label class="radio-option">
    <input type="radio" name="contact" value="phone">
    Phone
  </label>

  <label class="radio-option">
    <input type="radio" name="contact" value="email">
    Email
  </label>

</div>

</form>

</div>
<div class="wrapper">
<!-- TEXT BLOCK: heading + paragraph -->

 <h2>Contact Information</h2>
